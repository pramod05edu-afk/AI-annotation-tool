# One command starts everything:   docker compose up --build
# Values like ${POSTGRES_USER:-annotator} come from .env if present, otherwise the default after ":-".
name: ai-annotation-tool

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-annotator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-annotator}
      POSTGRES_DB: ${POSTGRES_DB:-annotator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port 5433 (not 5432) so it never clashes with a locally installed PostgreSQL.
      # Containers still reach it as postgres:5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1g }

  storage:
    # SeaweedFS: S3-compatible object storage (replaced MinIO, see docs/decisions/0002).
    # All-in-one mode: master + volume server + filer + S3 gateway in one container.
    image: chrislusf/seaweedfs:4.54
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      # SeaweedFS creates an S3 identity from these; requests with other keys are rejected.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-annotator}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-annotator-secret}
    volumes:
      - storagedata:/data
    ports:
      - "8333:8333" # S3 API
      - "8888:8888" # filer web UI (browse stored files)
    healthcheck:
      # 127.0.0.1, not localhost: in this Alpine image localhost resolves to IPv6 (::1),
      # but the S3 gateway listens on IPv4 only.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 512m }

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-annotator}:${POSTGRES_PASSWORD:-annotator}@postgres:5432/${POSTGRES_DB:-annotator}
      S3_ENDPOINT_URL: http://storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-annotator}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-annotator-secret}
      S3_BUCKET: ${S3_BUCKET:-annotations}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      WEIGHTS_DIR: /app/weights
      DETECTOR_WEIGHTS: ${DETECTOR_WEIGHTS:-yolo11n_helmet_openvino_model}
      OMP_NUM_THREADS: "4" # match the CPU limit below (PyTorch would otherwise use all host cores)
    volumes:
      # The repo's weights/ folder (git-ignored). On the first start the fine-tuned detector
      # (GitHub Release), MobileSAM and YOLOE with its text encoder (Ultralytics releases,
      # ~330 MB in total) are downloaded into it automatically; later starts reuse the files.
      - ./weights:/app/weights
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 4g, cpus: "4" }

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      backend: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 256m }

volumes:
  pgdata:
  storagedata:
