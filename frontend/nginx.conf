# Serves the built React app and forwards /api to the FastAPI backend.
# Runs as a non-root user (nginx-unprivileged image), so it listens on 8080.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Allow image uploads (the backend enforces its own per-file limit).
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;  # model inference can take a few seconds on CPU
    }

    # Single-page app: unknown paths return index.html and React handles the route.
    location / {
        try_files $uri /index.html;
    }
}
