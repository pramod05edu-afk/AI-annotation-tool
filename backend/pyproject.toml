[project]
name = "annotation-backend"
version = "0.1.0"
description = "Backend API for the AI-assisted image annotation platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.44.5",
    "fastapi>=0.164.0",
    "openvino==2026.4.1", # fast CPU inference for the exported detector
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2",
    "torch>=2.9",  # CPU-only build, see [tool.uv.sources]
    "torchvision>=0.24",
    "ultralytics==8.4.215", # same version as the Colab training notebook
    "uvicorn[standard]>=0.54.0",
]

# PyTorch from its CPU-only package index: the CUDA build is ~2.5 GB larger and unused here
# (the app runs on CPU; training happens on Colab).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, SIM: simplifications, N: naming
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends(...) in default arguments is the intended pattern
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "ultralytics.*", "cv2.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
