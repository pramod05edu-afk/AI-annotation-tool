name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      # Real PostgreSQL + pgvector for the API tests (same image as docker-compose.yml).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: annotator
          POSTGRES_PASSWORD: annotator
          POSTGRES_DB: annotator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U annotator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://annotator:annotator@localhost:5432/annotator_test
      REQUIRE_DB: "1" # database tests must fail, not skip, if the database is missing
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -v

  frontend:
    name: Frontend (lint, format, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
